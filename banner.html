<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaMi Admin | Gestión de Banners</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/flash-on.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --naranja: #ff6b00; --oscuro: #232f3e; --gris: #f0f2f5; --rojo: #ff4444; --azul: #2196F3; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding-bottom: 50px; }
        
        /* NAVBAR */
        .admin-nav { background: var(--oscuro); padding: 15px; display: flex; align-items: center; justify-content: space-between; color: white; position: sticky; top: 0; z-index: 1000; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; }
        
        .container { max-width: 600px; margin: auto; padding: 20px; }
        
        /* FORMULARIO */
        .form-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { font-size: 22px; font-weight: 900; color: var(--oscuro); margin-bottom: 20px; }
        
        label { font-size: 11px; font-weight: 800; color: #94a3b8; margin-left: 5px; display: block; margin-top: 10px; }
        input { width: 100%; padding: 14px; margin: 5px 0 15px; border: 1px solid #edf2f7; border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #f8fafc; }
        
        .row { display: flex; gap: 10px; }
        .btn-main { background: var(--naranja); color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        
        /* CARDS DE BANNERS */
        .banner-card { background: white; padding: 15px; border-radius: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid #f1f5f9; }
        .banner-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; background: #f8fafc; }
        .banner-info { flex: 1; }
        
        .actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-act { border: none; padding: 8px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-edit { background: #f1f5f9; color: #475569; }
        .btn-del { background: #fef2f2; color: var(--rojo); }

        /* TOAST */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast-card { background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-left: 5px solid var(--naranja); margin-bottom: 10px; animation: slideDown 0.4s forwards; }
        @keyframes slideDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<nav class="admin-nav">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span style="font-weight: 900; letter-spacing: 1px;">GESTIÓN DE BANNERS</span>
    <div style="width: 20px;"></div>
</nav>

<div class="container">
    <div class="form-container">
        <h2>Crear Publicidad</h2>
        <input type="hidden" id="banner-id">
        
        <label>TÍTULO PRINCIPAL</label>
        <input type="text" id="b-titulo" placeholder="Ej: Ofertas Relámpago">
        
        <label>SUBTÍTULO / DESCRIPCIÓN</label>
        <input type="text" id="b-subtitulo" placeholder="Ej: Solo por hoy 50% Dcto">
        
        <div class="row">
            <div style="flex:1">
                <label>COLOR BORDE (HEX)</label>
                <input type="text" id="b-color" placeholder="#ff6b00">
            </div>
            <div style="flex:1">
                <label>ORDEN (1, 2, 3...)</label>
                <input type="number" id="b-orden" placeholder="0">
            </div>
        </div>
        
        <label>URL DE LA IMAGEN</label>
        <input type="text" id="b-imagen" placeholder="Pegue el link de la imagen aquí">
        
        <label>LINK DE ACCIÓN (OPCIONAL)</label>
        <input type="text" id="b-link" placeholder="https://...">
        
        <button id="btn-save" class="btn-main" onclick="guardarBanner()">PUBLICAR BANNER</button>
        <button id="btn-cancel" onclick="limpiarForm()" style="display:none; width:100%; margin-top:10px; background:#eee; border:none; padding:10px; border-radius:12px; font-weight:bold; cursor:pointer;">CANCELAR</button>
    </div>

    <h2 style="padding-left: 10px;">Banners Activos</h2>
    <div id="lista-banners"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKCsoaFZ566UlgM1TeVqWNeOljroaP8VA",
        authDomain: "express-market-868d9.firebaseapp.com",
        projectId: "express-market-868d9",
        storageBucket: "express-market-868d9.firebasestorage.app",
        messagingSenderId: "502987186701",
        appId: "1:502987186701:web:9fb3c28ce377fb27552b44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allBanners = [];

    // --- CARGAR BANNERS ---
    onSnapshot(collection(db, "banners"), (snap) => {
        const lista = document.getElementById('lista-banners');
        allBanners = [];
        lista.innerHTML = '';
        
        if(snap.empty) {
            lista.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">No hay banners publicados.</div>';
            return;
        }

        snap.forEach(d => {
            const b = d.data();
            allBanners.push({ id: d.id, ...b });
            lista.innerHTML += `
                <div class="banner-card" style="border-left: 6px solid ${b.color || '#ff6b00'}">
                    <img src="${b.imagen}">
                    <div class="banner-info">
                        <strong style="color:var(--oscuro)">${b.titulo}</strong><br>
                        <small style="color:#64748b">Orden: ${b.orden}</small>
                    </div>
                    <div class="actions">
                        <button class="btn-act btn-edit" onclick="prepararEdit('${d.id}')">EDITAR</button>
                        <button class="btn-act btn-del" onclick="borrarBanner('${d.id}')">BORRAR</button>
                    </div>
                </div>`;
        });
    });

    // --- GUARDAR / ACTUALIZAR ---
    window.guardarBanner = async () => {
        const id = document.getElementById('banner-id').value;
        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";

        const datos = {
            titulo: document.getElementById('b-titulo').value,
            subtitulo: document.getElementById('b-subtitulo').value,
            color: document.getElementById('b-color').value || '#ff6b00',
            orden: Number(document.getElementById('b-orden').value) || 0,
            imagen: document.getElementById('b-imagen').value,
            link: document.getElementById('b-link').value || '',
            fecha: serverTimestamp()
        };

        try {
            if(id) {
                await updateDoc(doc(db, "banners", id), datos);
                showToast("Banner actualizado");
            } else {
                await addDoc(collection(db, "banners"), datos);
                showToast("Banner creado con éxito");
            }
            limpiarForm();
        } catch (e) {
            alert("Error al guardar");
        }
        btn.disabled = false;
        btn.innerText = "PUBLICAR BANNER";
    };

    // --- EDITAR ---
    window.prepararEdit = (id) => {
        const b = allBanners.find(x => x.id === id);
        document.getElementById('banner-id').value = b.id;
        document.getElementById('b-titulo').value = b.titulo;
        document.getElementById('b-subtitulo').value = b.subtitulo;
        document.getElementById('b-color').value = b.color;
        document.getElementById('b-orden').value = b.orden;
        document.getElementById('b-imagen').value = b.imagen;
        document.getElementById('b-link').value = b.link;
        
        document.getElementById('btn-save').innerText = "GUARDAR CAMBIOS";
        document.getElementById('btn-cancel').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // --- BORRAR ---
    window.borrarBanner = async (id) => {
        if(confirm("¿Seguro que quieres eliminar este banner?")) {
            await deleteDoc(doc(db, "banners", id));
            showToast("Banner eliminado");
        }
    };

    window.limpiarForm = () => {
        document.getElementById('banner-id').value = '';
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('btn-save').innerText = "PUBLICAR BANNER";
        document.getElementById('btn-cancel').style.display = 'none';
    };

    function showToast(text) {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast-card';
        t.innerHTML = `<i class="fas fa-check-circle" style="color:var(--naranja)"></i> <b>${text}</b>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
</script>
</body>
</html>
